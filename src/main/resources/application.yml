# ============================================
# Cloud Storage API - Configuración de la Aplicación
# ============================================

spring:
  application:
    name: cloud-storage-api

  # --- Configuración de Base de Datos ---
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudstorage
    username: cloudstorage
    password: cloudstorage

  # --- Configuración de JPA/Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  # --- Configuración de Multipart (subida de archivos) ---
  # Los archivos se cifran en streaming, pero la descarga aún se descifra en memoria:
  # no subir este límite por encima de lo que admita la RAM del contenedor.
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:512MB}
      max-request-size: ${APP_MAX_FILE_SIZE:512MB}

# --- Configuración de la Aplicación ---
app:
  jwt:
    # Obligatorio: sin valor por defecto (la app no arranca si falta)
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 86400000  # 24 horas en milisegundos
  encryption:
    # Obligatorio: 32 bytes en Base64, sin valor por defecto
    key: ${APP_ENCRYPTION_KEY:}
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads}
    quota-bytes: ${APP_STORAGE_QUOTA:5368709120}  # 5 GB por usuario (nunca más que la licencia)
  license-key: ${APP_LICENSE_KEY:}
  registration:
    # false: solo se puede registrar el primer usuario (el propietario)
    enabled: ${APP_REGISTRATION_ENABLED:true}
  rate-limit:
    # Host del proxy cuyas cabeceras CF-Connecting-IP/X-Forwarded-For son de fiar (vacío = ninguno)
    trusted-proxy-host: ${APP_TRUSTED_PROXY_HOST:}

# --- Configuración del Servidor ---
server:
  port: 8080

# --- Spring Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      enabled: true

# --- SpringDoc / Swagger UI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
  info:
    title: Cloud Storage API
    description: API REST para almacenamiento seguro de archivos en la nube con cifrado AES-256-GCM
    version: "1.0.0"
    contact:
      name: CloudStorage Team

# --- Configuración de Logging ---
logging:
  level:
    com.cloudstorage: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
